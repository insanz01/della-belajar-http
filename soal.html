<!doctype html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
            integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
            crossorigin="anonymous"
        />

        <title>Kumpulan Soal Latihan</title>
    </head>
    <body>
        <div class="container">
            <h1 class="my-4">Latihan Soal</h1>

            <div class="row mb-2" id="card-container"></div>
        </div>

        <!-- Optional JavaScript; choose one of the two! -->

        <!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
        <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
            integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
            crossorigin="anonymous"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
            crossorigin="anonymous"
        ></script>

        <script>
            const listSoal = [
                {
                    soal: "1. Buatkan http server sederhana dengan menerapkan konsep RESTful API (GET, POST, PUT, PATCH dan DELETE) untuk mengelola data Kontak",
                    deskripsi: `
                        <table class="table table-bordered">
                          <thead>
                            <tr>
                              <th>Name</th>
                              <th>Type</th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr>
                              <td>name</td>
                              <td>string</td>
                            </tr>
                            <tr>
                              <td>alamat</td>
                              <td>string</td>
                            </tr>
                            <tr>
                              <td>phone</td>
                              <td>string</td>
                            </tr>
                            <tr>
                              <td>sosmed</td>
                              <td>[]string (cth: facebook,instagram,twitter) - dipisahkan oleh koma</td>
                            </tr>
                          </tbody>
                        </table>

                        <p class="my-1">Aturan : </p>
                        <ol>
                          <li>Kolom nama tidak boleh kosong. jika kosong, maka akan tampilkan error</li>
                          <li>Kolom alamat tidak boleh kosong. jika kosong, maka akan tampilkan error</li>
                          <li>Kolom phone tidak boleh kosong. jika kosong, maka akan tampilkan error</li>
                          <li>Kolom sosmed boleh kosong. Kolom sosmed berupa array, dipisahkan oleh koma</li>
                          <li>Kolom nama tidak boleh mengandung angka. Jika ada angka, maka akan tampilkan error</li>
                          <li>Kolom phone tidak boleh mengandung huruf. Jika ada huruf, maka akan tampilkan error</li>
                        </ol>
                      `,
                },
                {
                    soal: "2. Buatkan http server sederhana untuk melakukan registrasi user (GET, POST dan DELETE)",
                    deskripsi: `
                        <table class="table table-bordered">
                          <thead>
                            <tr>
                              <th>Name</th>
                              <th>Type</th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr>
                              <td>email</td>
                              <td>string</td>
                            </tr>
                            <tr>
                              <td>password</td>
                              <td>string</td>
                            </tr>
                          </tbody>
                        </table>

                        <p class="my-1">Aturan : </p>
                        <ol>
                          <li>Kolom email tidak boleh kosong. jika kosong, maka akan tampilkan error</li>
                          <li>Kolom password tidak boleh kosong. jika kosong, maka akan tampilkan error</li>
                          <li>Email tidak boleh sama dengan data email yang telah tersimpan. jika email sudah ada. maka akan tampilkan error</li>
                          <li>Format email harus sesuai, jika email tidak sesuai. maka akan tampilkan error</li>
                          <li>Password minimal 5 karakter, jika kurang dari 5 karakter, maka akan tampilkan error</li>
                          <li>Password maksimal 10 karakter, jika lebih dari 5 karakter, maka akan tampilkan error</li>
                          <li>Password harus memiliki kombinasi huruf, simbol dan angka. Jika tidak, maka akan tampilkan error</li>
                        </ol>
                      `,
                },
            ];

            window.addEventListener("load", () => {
                temp = ``;
                listSoal.forEach((res) => {
                    temp += `
                      <div class="col-12">
                          <div class="card">
                              <div class="card-body">
                                  <h5 class="card-title">${res.soal}</h5>
                                  <div class="card-text">${res.deskripsi}</div>
                              </div>
                          </div>
                      </div>
                    `;
                });

                document.getElementById("card-container").innerHTML = temp;
            });
        </script>

        <!-- Option 2: Separate Popper and Bootstrap JS -->
        <!--
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    --></body>
</html>
